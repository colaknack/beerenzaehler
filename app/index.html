<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f4858">
<title>Beerenzähler</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --bg:#f4f4f1; --card:#fff; --ink:#1c1c1a; --mut:#6b6b64;
    --line:#dcdcd4; --acc:#2f4858; --ok:#2e7d4f; --warn:#a8442a;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#16171a; --card:#202226; --ink:#ecece8; --mut:#9a9a94;
           --line:#33353a; --acc:#7fb0c8; }
  }
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:10;background:var(--acc);color:#fff;
         padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
         display:flex;align-items:center;gap:10px}
  header h1{font-size:17px;margin:0;font-weight:600;flex:1}
  header .n{font-variant-numeric:tabular-nums;font-size:15px;opacity:.85}
  main{padding:12px;max-width:820px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:14px;margin-bottom:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1 1 150px}
  label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px}
  input,select,button{font:inherit;color:inherit}
  input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;
               background:var(--bg)}
  button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:13px 16px;
         font-weight:600;cursor:pointer}
  button.sec{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
  button:disabled{opacity:.45;cursor:default}
  .btns{display:flex;gap:10px;margin-top:12px}
  .btns>button{flex:1}
  #stage{position:relative;background:#000;border-radius:10px;overflow:hidden;
         touch-action:manipulation;line-height:0}
  #stage canvas{width:100%;height:auto;display:block}
  #busy{position:absolute;inset:0;display:none;place-items:center;
        background:rgba(0,0,0,.55);color:#fff;font-weight:600}
  #busy.on{display:grid}
  .count{display:flex;align-items:baseline;gap:10px;margin:12px 0 4px}
  .count b{font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
  .count span{color:var(--mut);font-size:13.5px}
  .hint{font-size:13px;color:var(--mut);margin:8px 0 0}
  .warn{color:var(--warn)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);
        font-variant-numeric:tabular-nums}
  th{color:var(--mut);font-weight:600;font-size:12px}
  .hide{display:none}
  input[type=range]{padding:0}
  .slider{display:flex;align-items:center;gap:10px}
  .slider output{min-width:52px;text-align:right;font-variant-numeric:tabular-nums;
                 color:var(--mut);font-size:14px}

  /* Auswahlflaechen fuer Sorte und Standort. Mindesthoehe 46 px, damit sie sich
     mit Handschuhen und in Eile sicher treffen lassen. */
  .pick{margin-bottom:14px}
  .pick:last-of-type{margin-bottom:0}
  .pick .head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .pick .head label{margin:0;flex:1}
  .pick .head button{background:none;border:0;color:var(--acc);font-size:13px;
                     font-weight:600;padding:6px 2px;cursor:pointer;width:auto;flex:0 0 auto}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;
        padding:0 15px;min-height:46px;font-size:15px;color:var(--ink);cursor:pointer;
        display:inline-flex;align-items:center;gap:8px;width:auto;font-weight:400}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  .chip.add{border-style:dashed;color:var(--mut)}
  .chip .x{font-weight:700;opacity:.7;margin-right:-4px;padding:0 2px}
  .sel{display:flex;align-items:center;gap:10px;min-height:46px}
  .sel .val{flex:1;font-size:17px;font-weight:600}
  .sel .val.leer{color:var(--mut);font-weight:400;font-size:15px}
  .addrow{display:flex;gap:8px;margin-top:9px}
  .addrow input{flex:1;min-height:46px}
  .addrow button{flex:0 0 auto;width:auto;padding:0 16px;min-height:46px}
  .chip input.ren{border:0;background:transparent;padding:0;width:8.5em;font:inherit;
                  color:inherit;min-height:0}
</style>
</head>
<body>

<header>
  <h1>Beerenzähler</h1>
  <span class="n" id="hdrCount"></span>
</header>

<main>

  <!-- ------------------------------------------------ Aufnahme / Auswertung -->
  <section class="card" id="cardShot">
    <div class="pick" id="pickSorte"></div>
    <div class="pick" id="pickStandort"></div>
    <div class="btns">
      <button id="btnCam">Foto aufnehmen</button>
      <button id="btnFile" class="sec">Datei wählen</button>
    </div>
    <input type="file" id="fileCam" accept="image/*" capture="environment" class="hide">
    <input type="file" id="fileAny" accept="image/*" class="hide">
  </section>

  <!-- ----------------------------------------------------------- Ergebnis -->
  <section class="card hide" id="cardResult">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="busy">zähle …</div>
    </div>

    <div class="count">
      <b id="num">0</b>
      <span>Beeren &middot; tippen zum Korrigieren</span>
    </div>
    <p class="hint" id="quality"></p>

    <div style="margin-top:12px">
      <label for="rad">Beerengröße kalibrieren (wird gemerkt)</label>
      <div class="slider">
        <input type="range" id="rad" min="8" max="80" step="1">
        <output id="radOut"></output>
      </div>
    </div>

    <div class="row" style="margin-top:12px">
      <div>
        <label for="gew">Gewicht in g (optional)</label>
        <!-- bewusst text statt number: bei type=number verwirft der Browser
             das deutsche Dezimalkomma und liefert einen leeren Wert -->
        <input id="gew" type="text" inputmode="decimal" placeholder="—">
      </div>
      <div>
        <label>Einzelbeerengewicht</label>
        <input id="ebg" readonly tabindex="-1" placeholder="—">
      </div>
    </div>

    <div class="btns">
      <button id="btnSave">Probe speichern</button>
      <button id="btnDrop" class="sec">Verwerfen</button>
    </div>
  </section>

  <!-- ------------------------------------------------------------ Proben -->
  <section class="card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <strong style="flex:1">Proben</strong>
      <button id="btnCsv" class="sec" style="padding:8px 12px;font-size:14px">CSV</button>
    </div>
    <table>
      <thead><tr><th>Zeit</th><th>Sorte</th><th>Standort</th><th style="text-align:right">n</th><th style="text-align:right">g</th><th></th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <p class="hint" id="empty">Noch keine Proben erfasst.</p>
  </section>

</main>

<script src="vision.js"></script>
<script>
'use strict';

/* --------------------------------------------------------------- Zustand -- */
const S = {
  img: null,        // ImageBitmap in Arbeitsaufloesung
  w: 0, h: 0,
  rgba: null,       // Pixeldaten fuer die Auswertung
  peaks: [],        // {x,y} in Bildkoordinaten
  radius: 30,
  tray: null, feat: null,
  dirty: false
};
const WORK = 1600;                       // Arbeitsbreite der Auswertung
const LS = { radius: 'bz.radius', sorte: 'bz.sorte', standort: 'bz.standort' };

const $ = function (id) { return document.getElementById(id); };

/* ------------------------------------------------- Auswahl Sorte/Standort --
   Beide Listen liegen im Speicher des Geraets und lassen sich in der App
   bearbeiten und erweitern. Bewusst geraetelokal: jeder Messplatz pflegt die
   Liste, die er braucht, ohne Abstimmung mit den anderen. */
const START = {
  sorten: ['Dornfelder', 'Grauburgunder', 'Müller-Thurgau', 'Portugieser',
           'Regent', 'Riesling', 'Sauvignon blanc', 'Silvaner',
           'Souvignier gris', 'Spätburgunder', 'Weißburgunder'],
  standorte: ['Bingen', 'Flörsheim-Dalsheim', 'Gau-Algesheim', 'Gau-Odernheim',
              'Guntersblum', 'Mommenheim', 'Offstein', 'Oppenheim',
              'Stadecken-Elsheim', 'Westhofen', 'Wöllstein']
};

/* Deutsche Sortierung: Umlaute wie die Grundbuchstaben, ss fuer ß.
   Die Listen werden bei jedem Schreiben neu sortiert, damit spaeter
   hinzugefuegte Eintraege an ihrer Stelle stehen und nicht hinten anhaengen. */
const COLL = new Intl.Collator('de', { sensitivity: 'base', numeric: true });
function sortDe(arr) { return arr.slice().sort(function (a, b) { return COLL.compare(a, b); }); }

function listGet(key) {
  try {
    const v = JSON.parse(localStorage.getItem('bz.liste.' + key) || 'null');
    if (Array.isArray(v)) return sortDe(v);
  } catch (e) { /* beschaedigter Eintrag -> Startliste */ }
  return sortDe(START[key]);
}
function listSet(key, arr) {
  localStorage.setItem('bz.liste.' + key, JSON.stringify(sortDe(arr)));
}

/* Neue Startlisten auf Geraete bringen, die schon eine aeltere Fassung haben.
   Bewusst nur ergaenzend: selbst angelegte Eintraege bleiben unangetastet,
   entfernte Standardeintraege kommen allerdings wieder. */
const SEED_VERSION = 2;
function seedLists() {
  if (parseInt(localStorage.getItem('bz.liste.version') || '0', 10) >= SEED_VERSION) return;
  ['sorten', 'standorte'].forEach(function (k) {
    const merged = listGet(k);
    START[k].forEach(function (s) {
      if (!merged.some(function (x) { return COLL.compare(x, s) === 0; })) merged.push(s);
    });
    listSet(k, merged);
  });
  localStorage.setItem('bz.liste.version', String(SEED_VERSION));
}

function Picker(key, label, host, onChange) {
  this.key = key; this.label = label; this.host = host; this.onChange = onChange;
  this.items = listGet(key);
  this.value = localStorage.getItem('bz.sel.' + key) || '';
  if (this.value && this.items.indexOf(this.value) < 0) this.value = '';
  this.open = !this.value;          // ausgewaehlt -> eingeklappt, spart Platz
  this.edit = false;
  this.render();
}

Picker.prototype.select = function (v) {
  this.value = v;
  localStorage.setItem('bz.sel.' + this.key, v);
  this.open = false; this.edit = false;
  this.render();
  if (this.onChange) this.onChange(v);
};

/* Vorhandener Eintrag, unabhaengig von Gross-/Kleinschreibung und Umlautform --
   sonst stehen "Riesling" und "riesling" nebeneinander in der Liste. */
Picker.prototype.find = function (v) {
  for (let i = 0; i < this.items.length; i++) {
    if (COLL.compare(this.items[i], v) === 0) return this.items[i];
  }
  return null;
};

Picker.prototype.store = function (arr) {
  listSet(this.key, arr);
  this.items = listGet(this.key);          // sortiert zurueckholen
};

/* Nimmt einen Wert in die Liste auf, falls er noch fehlt (z. B. aus alten
   Proben oder aus einer frueheren Fassung der App). */
Picker.prototype.ensure = function (v) {
  v = (v || '').trim();
  if (!v || this.find(v)) return;
  this.store(this.items.concat([v]));
  this.render();
};

Picker.prototype.add = function (v) {
  v = (v || '').trim();
  if (!v) return;
  const vorhanden = this.find(v);
  if (vorhanden) { this.select(vorhanden); return; }
  this.store(this.items.concat([v]));
  this.select(v);
};

Picker.prototype.remove = function (v) {
  const i = this.items.indexOf(v);
  if (i < 0) return;
  const rest = this.items.slice();
  rest.splice(i, 1);
  this.store(rest);
  localStorage.removeItem(LS.radius + '.' + v.toLowerCase());
  if (this.value === v) { this.value = ''; localStorage.removeItem('bz.sel.' + this.key); }
  this.render();
};

Picker.prototype.rename = function (alt, neu) {
  neu = (neu || '').trim();
  const i = this.items.indexOf(alt);
  if (i < 0 || !neu || neu === alt) { this.render(); return; }
  const kollision = this.find(neu);
  if (kollision && kollision !== alt) { this.render(); return; }   // Dublette
  const next = this.items.slice();
  next[i] = neu;
  this.store(next);
  // Kalibrierung mit umziehen, sonst geht sie beim Umbenennen verloren
  const old = localStorage.getItem(LS.radius + '.' + alt.toLowerCase());
  if (old) {
    localStorage.setItem(LS.radius + '.' + neu.toLowerCase(), old);
    localStorage.removeItem(LS.radius + '.' + alt.toLowerCase());
  }
  if (this.value === alt) { this.value = neu; localStorage.setItem('bz.sel.' + this.key, neu); }
  this.render();
};

Picker.prototype.render = function () {
  const self = this;
  const h = document.createElement('div');
  h.className = 'head';
  const lab = document.createElement('label');
  lab.textContent = this.label;
  h.appendChild(lab);

  if (this.open) {
    const be = document.createElement('button');
    be.type = 'button';
    be.textContent = this.edit ? 'Fertig' : 'Liste bearbeiten';
    be.onclick = function () { self.edit = !self.edit; self.render(); };
    h.appendChild(be);
  }

  this.host.innerHTML = '';
  this.host.appendChild(h);

  if (!this.open) {
    const row = document.createElement('div');
    row.className = 'sel';
    const v = document.createElement('span');
    v.className = 'val' + (this.value ? '' : ' leer');
    v.textContent = this.value || 'nichts gewählt';
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sec';
    b.style.cssText = 'width:auto;flex:0 0 auto;padding:10px 16px;min-height:46px';
    b.textContent = 'ändern';
    b.onclick = function () { self.open = true; self.render(); };
    row.appendChild(v); row.appendChild(b);
    this.host.appendChild(row);
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'chips';
  this.items.forEach(function (it) {
    const c = document.createElement('button');
    c.type = 'button';
    c.className = 'chip' + (it === self.value && !self.edit ? ' on' : '');
    const t = document.createElement('span');
    t.textContent = it;
    c.appendChild(t);
    if (self.edit) {
      const x = document.createElement('span');
      x.className = 'x'; x.textContent = '✕';
      x.onclick = function (e) {
        e.stopPropagation();
        if (confirm('„' + it + '" aus der Liste entfernen?')) self.remove(it);
      };
      c.appendChild(x);
      // Antippen im Bearbeiten-Modus benennt um
      c.onclick = function () {
        const inp = document.createElement('input');
        inp.className = 'ren'; inp.value = it;
        c.replaceChild(inp, t);
        inp.focus(); inp.select();
        let done = false;
        const fin = function () { if (!done) { done = true; self.rename(it, inp.value); } };
        inp.onblur = fin;
        inp.onkeydown = function (e) {
          if (e.key === 'Enter') { e.preventDefault(); fin(); }
          if (e.key === 'Escape') { done = true; self.render(); }
        };
        inp.onclick = function (e) { e.stopPropagation(); };
      };
    } else {
      c.onclick = function () { self.select(it); };
    }
    wrap.appendChild(c);
  });

  if (!this.edit) {
    const plus = document.createElement('button');
    plus.type = 'button'; plus.className = 'chip add';
    plus.textContent = '+ Neu';
    plus.onclick = function () { self.edit = true; self.render(); };
    wrap.appendChild(plus);
  }
  this.host.appendChild(wrap);

  if (this.edit) {
    const row = document.createElement('div');
    row.className = 'addrow';
    const inp = document.createElement('input');
    inp.placeholder = this.label + ' hinzufügen';
    inp.autocomplete = 'off';
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = 'Hinzufügen';
    const go = function () { const v = inp.value; inp.value = ''; if (v.trim()) self.add(v); };
    b.onclick = go;
    inp.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); go(); } };
    row.appendChild(inp); row.appendChild(b);
    this.host.appendChild(row);
    const hint = document.createElement('p');
    hint.className = 'hint';
    hint.textContent = 'Eintrag antippen zum Umbenennen, ✕ entfernt ihn.';
    this.host.appendChild(hint);
  }
};

let pSorte = null, pStandort = null;
function sorteVal() { return pSorte ? pSorte.value : ''; }
function standortVal() { return pStandort ? pStandort.value : ''; }

/* Die Beerengroesse haengt an der Sorte -- Riesling und Dornfelder liegen weit
   auseinander. Die Kalibrierung wird deshalb je Sorte gemerkt, mit dem zuletzt
   benutzten Wert als Rueckfall fuer eine noch unbekannte Sorte. */
function radiusKey() {
  const s = sorteVal().trim().toLowerCase();
  return s ? LS.radius + '.' + s : LS.radius;
}
function loadRadius() {
  const v = parseFloat(localStorage.getItem(radiusKey()) || '');
  if (v > 0) return v;
  const g = parseFloat(localStorage.getItem(LS.radius) || '');
  return g > 0 ? g : 0;
}
function saveRadius(r) {
  localStorage.setItem(radiusKey(), String(r));
  localStorage.setItem(LS.radius, String(r));
}

/* ------------------------------------------------------------ Datenbank -- */
let db = null;
function openDb() {
  return new Promise(function (res, rej) {
    const rq = indexedDB.open('beerenzaehler', 1);
    rq.onupgradeneeded = function () {
      rq.result.createObjectStore('proben', { keyPath: 'id', autoIncrement: true });
    };
    rq.onsuccess = function () { db = rq.result; res(db); };
    rq.onerror = function () { rej(rq.error); };
  });
}
function tx(mode) { return db.transaction('proben', mode).objectStore('proben'); }
function dbAll() {
  return new Promise(function (res) {
    const rq = tx('readonly').getAll();
    rq.onsuccess = function () { res(rq.result || []); };
    rq.onerror = function () { res([]); };
  });
}
/* Auf den Abschluss der Transaktion warten, nicht nur auf die Anfrage --
   sonst kann die Liste neu gelesen werden, bevor der Satz geschrieben ist. */
function dbAdd(rec) {
  return new Promise(function (res, rej) {
    const t = db.transaction('proben', 'readwrite');
    t.objectStore('proben').add(rec);
    t.oncomplete = res;
    t.onerror = function () { rej(t.error); };
  });
}
function dbDel(id) {
  return new Promise(function (res) { tx('readwrite').delete(id).onsuccess = res; });
}

/* --------------------------------------------------------------- Anzeige -- */
function draw() {
  const cv = $('cv'), ctx = cv.getContext('2d');
  cv.width = S.w; cv.height = S.h;
  ctx.drawImage(S.img, 0, 0, S.w, S.h);
  const r = S.radius;
  ctx.lineWidth = Math.max(2, r * 0.10);
  ctx.strokeStyle = 'rgba(40,230,90,.95)';
  ctx.fillStyle = 'rgba(255,60,60,.95)';
  for (let i = 0; i < S.peaks.length; i++) {
    const p = S.peaks[i];
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.2832); ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1.5, r * 0.09), 0, 6.2832); ctx.fill();
  }
  $('num').textContent = S.peaks.length;
  $('hdrCount').textContent = S.peaks.length ? S.peaks.length + ' Beeren' : '';
  updateEbg();
}

function updateEbg() {
  const g = parseFloat(($('gew').value || '').replace(',', '.'));
  $('ebg').value = (g > 0 && S.peaks.length)
    ? (g / S.peaks.length).toFixed(3).replace('.', ',') + ' g' : '';
}

/* Warnt, wenn das Foto die Auswertung erschwert. Lieber ein Hinweis als eine
   still falsche Zahl. */
function quality() {
  const msgs = [];
  const cv = document.createElement('canvas');
  cv.width = S.w; cv.height = S.h;
  const ctx = cv.getContext('2d');
  ctx.drawImage(S.img, 0, 0, S.w, S.h);
  const d = ctx.getImageData(0, 0, S.w, S.h).data;
  // Schaerfe: Varianz des Laplace-Operators auf einer groben Stichprobe
  let sum = 0, sum2 = 0, cnt = 0;
  const stp = 3;
  for (let y = stp; y < S.h - stp; y += stp) {
    for (let x = stp; x < S.w - stp; x += stp) {
      const i = (y * S.w + x) * 4;
      const c = d[i], l = d[i - 4 * stp], rr = d[i + 4 * stp];
      const u = d[i - 4 * stp * S.w], b = d[i + 4 * stp * S.w];
      const lap = 4 * c - l - rr - u - b;
      sum += lap; sum2 += lap * lap; cnt++;
    }
  }
  const varLap = sum2 / cnt - (sum / cnt) * (sum / cnt);
  if (varLap < 60) msgs.push('Foto wirkt unscharf – bitte wiederholen.');
  if (S.peaks.length > 190) msgs.push('Sehr viele Beeren – bitte auf zwei Schalen verteilen.');
  const el = $('quality');
  el.textContent = msgs.join(' ');
  el.className = msgs.length ? 'hint warn' : 'hint';
}

/* -------------------------------------------------------------- Ablauf --- */
async function loadImage(file) {
  $('cardResult').classList.remove('hide');
  $('busy').classList.add('on');
  await new Promise(function (r) { setTimeout(r, 30); });   // UI zeichnen lassen

  let bmp;
  try {
    bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (e) {
    bmp = await createImageBitmap(file);                    // aeltere Browser
  }
  const sc = Math.min(1, WORK / Math.max(bmp.width, bmp.height));
  S.w = Math.round(bmp.width * sc); S.h = Math.round(bmp.height * sc);
  const off = document.createElement('canvas');
  off.width = S.w; off.height = S.h;
  const octx = off.getContext('2d', { willReadFrequently: true });
  octx.drawImage(bmp, 0, 0, S.w, S.h);
  S.img = off;
  S.rgba = octx.getImageData(0, 0, S.w, S.h).data;

  S.tray = Vision.findTray(S.rgba, S.w, S.h);
  S.feat = Vision._i.berryFeatures(S.rgba, S.w, S.h, S.tray);

  const saved = loadRadius();
  const res = Vision.count(S.rgba, S.w, S.h, {
    tray: S.tray, features: S.feat, radius: saved > 0 ? saved : undefined
  });
  S.radius = res.radius;
  S.peaks = res.peaks.map(function (p) { return { x: p.x, y: p.y }; });

  $('rad').min = Math.max(6, Math.round(Math.min(S.w, S.h) * 0.008));
  $('rad').max = Math.round(Math.min(S.w, S.h) * 0.08);
  $('rad').value = Math.round(S.radius);
  $('radOut').textContent = Math.round(S.radius) + ' px';

  S.dirty = false;
  $('busy').classList.remove('on');
  draw();
  quality();
  $('cardResult').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function recount() {
  $('busy').classList.add('on');
  await new Promise(function (r) { setTimeout(r, 30); });
  const res = Vision.count(S.rgba, S.w, S.h, {
    tray: S.tray, features: S.feat, radius: S.radius
  });
  S.peaks = res.peaks.map(function (p) { return { x: p.x, y: p.y }; });
  $('busy').classList.remove('on');
  draw(); quality();
}

/* Tippen: Treffer in der Naehe entfernen, sonst neue Beere setzen. */
$('cv').addEventListener('click', function (ev) {
  if (!S.img) return;
  const rect = ev.target.getBoundingClientRect();
  const x = (ev.clientX - rect.left) / rect.width * S.w;
  const y = (ev.clientY - rect.top) / rect.height * S.h;
  let hit = -1, best = S.radius * 1.15;
  for (let i = 0; i < S.peaks.length; i++) {
    const dx = S.peaks[i].x - x, dy = S.peaks[i].y - y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < best) { best = d; hit = i; }
  }
  if (hit >= 0) S.peaks.splice(hit, 1); else S.peaks.push({ x: x, y: y });
  S.dirty = true;
  draw();
});

$('rad').addEventListener('input', function () {
  S.radius = parseFloat(this.value);
  $('radOut').textContent = Math.round(S.radius) + ' px';
  draw();
});
$('rad').addEventListener('change', function () {
  saveRadius(S.radius);
  recount();
});

/* Sortenwechsel: die dazu gespeicherte Kalibrierung uebernehmen und neu zaehlen. */
function onSorteChange() {
  if (!S.img) return;
  const r = loadRadius();
  if (r > 0 && Math.abs(r - S.radius) > 0.5) {
    S.radius = r;
    $('rad').value = Math.round(r);
    $('radOut').textContent = Math.round(r) + ' px';
    recount();
  }
}
$('gew').addEventListener('input', updateEbg);

$('btnCam').onclick = function () { $('fileCam').click(); };
$('btnFile').onclick = function () { $('fileAny').click(); };
$('fileCam').onchange = function () { if (this.files[0]) loadImage(this.files[0]); this.value = ''; };
$('fileAny').onchange = function () { if (this.files[0]) loadImage(this.files[0]); this.value = ''; };

$('btnDrop').onclick = function () {
  S.img = null; S.peaks = [];
  $('cardResult').classList.add('hide');
  $('hdrCount').textContent = '';
};

$('btnSave').onclick = async function () {
  if (!S.img) return;
  const g = parseFloat(($('gew').value || '').replace(',', '.'));
  const rec = {
    ts: Date.now(),
    sorte: sorteVal().trim(),
    standort: standortVal().trim(),
    n: S.peaks.length,
    gewicht: isFinite(g) && g > 0 ? g : null,
    radius: Math.round(S.radius),
    korrigiert: S.dirty
  };
  await dbAdd(rec);
  $('gew').value = '';
  $('btnDrop').onclick();
  await refresh();
};

/* ----------------------------------------------------------- Probenliste -- */
function fmt(ts) {
  const d = new Date(ts);
  const p = function (v) { return String(v).padStart(2, '0'); };
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '. ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

async function refresh() {
  const all = (await dbAll()).sort(function (a, b) { return b.ts - a.ts; });
  const tb = $('tbody');
  tb.innerHTML = '';
  $('empty').style.display = all.length ? 'none' : '';
  $('btnCsv').disabled = !all.length;
  const sorten = new Set(), orte = new Set();
  all.forEach(function (r) {
    if (r.sorte) sorten.add(r.sorte);
    if (r.standort) orte.add(r.standort);
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + fmt(r.ts) + '</td><td>' + (r.sorte || '—') + '</td><td>' + (r.standort || '—') +
      '</td><td style="text-align:right"><strong>' + r.n + '</strong></td>' +
      '<td style="text-align:right">' + (r.gewicht != null ? String(r.gewicht).replace('.', ',') : '—') + '</td>' +
      '<td style="text-align:right"><button class="sec" data-del="' + r.id +
      '" style="padding:3px 9px;font-size:13px">✕</button></td>';
    tb.appendChild(tr);
  });
  tb.querySelectorAll('[data-del]').forEach(function (b) {
    b.onclick = async function () { await dbDel(+b.dataset.del); refresh(); };
  });
  // Werte aus frueheren Proben in die Auswahllisten uebernehmen, damit beim
  // Wechsel auf die Schaltflaechen nichts verloren geht.
  if (pSorte) sorten.forEach(function (v) { pSorte.ensure(v); });
  if (pStandort) orte.forEach(function (v) { pStandort.ensure(v); });
}

/* ------------------------------------------------------------- Ausgabe --- */
$('btnCsv').onclick = async function () {
  const all = (await dbAll()).sort(function (a, b) { return a.ts - b.ts; });
  const dec = function (v) { return v == null ? '' : String(v).replace('.', ','); };
  const lines = ['Datum;Uhrzeit;Sorte;Standort;Anzahl;Gewicht_g;Einzelbeerengewicht_g;Korrigiert'];
  all.forEach(function (r) {
    const d = new Date(r.ts);
    const p = function (v) { return String(v).padStart(2, '0'); };
    lines.push([
      p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear(),
      p(d.getHours()) + ':' + p(d.getMinutes()),
      r.sorte || '', r.standort || '', r.n,
      dec(r.gewicht),
      dec(r.gewicht != null && r.n ? (r.gewicht / r.n).toFixed(4) : null),
      r.korrigiert ? 'ja' : 'nein'
    ].join(';'));
  });
  // BOM, damit Excel die Umlaute richtig liest
  const blob = new Blob(['﻿' + lines.join('\r\n')],
    { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'beeren_' + new Date().toISOString().slice(0, 10) + '.csv';
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
};

/* ---------------------------------------------------------------- Start -- */
(async function () {
  seedLists();
  pSorte = new Picker('sorten', 'Sorte', $('pickSorte'), onSorteChange);
  pStandort = new Picker('standorte', 'Standort', $('pickStandort'), null);
  // Uebernahme aus einer frueheren Fassung, die noch Textfelder hatte
  ['sorte', 'standort'].forEach(function (k) {
    const v = localStorage.getItem(LS[k]);
    if (!v) return;
    const p = k === 'sorte' ? pSorte : pStandort;
    p.ensure(v);
    if (!p.value) p.select(v);
    localStorage.removeItem(LS[k]);
  });
  await openDb();
  await refresh();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
